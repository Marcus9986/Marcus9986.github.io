name: Draft project entries

# Daily (and on demand): when a repo is newly tagged `portfolio`, or a repo that already has an
# entry changes, Claude drafts the entry or suggests updates and this opens a pull request on the
# branch auto/project-drafts. Nothing reaches the site until you merge it.
on:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: project-drafts
  cancel-in-progress: false

jobs:
  # While a drafts PR is open, don't redraft: it would cost again and overwrite your edits on it.
  check:
    runs-on: ubuntu-latest
    outputs:
      open: ${{ steps.pr.outputs.open }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr view auto/project-drafts --repo "$GITHUB_REPOSITORY" --json state -q .state 2>/dev/null | grep -q OPEN; then
            echo "::notice::A drafts pull request is still open. Merge or close it to get new drafts."
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
          fi

  draft:
    needs: check
    if: needs.check.outputs.open != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Sync tagged repos
        run: node scripts/sync-repos.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draft entries with Claude
        id: draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret is not set; skipping drafts."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/draft-entries.mjs | tee "$RUNNER_TEMP/draft.log"
          grep -E '^changed=' "$RUNNER_TEMP/draft.log" | tail -1 >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.draft.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B auto/project-drafts
          git add src/repos.json src/drafts.js projects
          git commit -m "Draft project entries from GitHub repos"
          git push --force origin auto/project-drafts
          gh pr create --head auto/project-drafts --base main \
            --title "Draft project entries from GitHub repos" --body-file "$RUNNER_TEMP/pr-body.md"
